<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0A0F"/>
      <stop offset="50%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#0A0A0F"/>
    </linearGradient>
    <linearGradient id="glow1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="grid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.03)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
    <filter id="neon">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="termClip">
      <rect x="100" y="120" width="400" height="220" rx="12"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg)"/>

  <!-- Grid overlay -->
  <g opacity="0.4">
    <line x1="0" y1="80" x2="1200" y2="80" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    <line x1="0" y1="160" x2="1200" y2="160" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    <line x1="0" y1="240" x2="1200" y2="240" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    <line x1="0" y1="320" x2="1200" y2="320" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    <line x1="200" y1="0" x2="200" y2="400" stroke="rgba(255,255,255,0.02)" stroke-width="1"/>
    <line x1="400" y1="0" x2="400" y2="400" stroke="rgba(255,255,255,0.02)" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="400" stroke="rgba(255,255,255,0.02)" stroke-width="1"/>
    <line x1="800" y1="0" x2="800" y2="400" stroke="rgba(255,255,255,0.02)" stroke-width="1"/>
    <line x1="1000" y1="0" x2="1000" y2="400" stroke="rgba(255,255,255,0.02)" stroke-width="1"/>
  </g>

  <!-- Glow orb -->
  <circle cx="350" cy="200" r="180" fill="url(#glow1)"/>
  <circle cx="850" cy="150" r="120" fill="rgba(59,130,246,0.04)"/>

  <!-- Decorative dots -->
  <g fill="#10B981" opacity="0.15">
    <circle cx="80" cy="60" r="3"/>
    <circle cx="1120" cy="80" r="2"/>
    <circle cx="1050" cy="340" r="2.5"/>
    <circle cx="150" cy="350" r="2"/>
    <circle cx="500" cy="50" r="1.5"/>
    <circle cx="950" cy="50" r="2"/>
  </g>

  <!-- Terminal Box -->
  <g>
    <rect x="100" y="120" width="440" height="220" rx="12" fill="#16161E" stroke="#2A2A3E" stroke-width="1.5"/>
    <rect x="100" y="120" width="440" height="36" rx="12" fill="#1A1A2E"/>
    <rect x="100" y="144" width="440" height="12" fill="#1A1A2E"/>
    <!-- Terminal dots -->
    <circle cx="126" cy="138" r="6" fill="#FF5F56"/>
    <circle cx="146" cy="138" r="6" fill="#FFBD2E"/>
    <circle cx="166" cy="138" r="6" fill="#27C93F"/>
    <text x="190" y="143" fill="#71717A" font-family="monospace" font-size="12">zerfi@launch:~$</text>

    <!-- Terminal content -->
    <g font-family="monospace" font-size="14">
      <text x="124" y="180" fill="#10B981">$</text>
      <text x="140" y="180" fill="#F8FAFC">zerfi --scan</text>
      <text x="124" y="202" fill="#71717A">[+] Scanning nearby networks...</text>
      <text x="124" y="224" fill="#71717A">[+] Found</text>
      <text x="196" y="224" fill="#10B981">5</text>
      <text x="212" y="224" fill="#71717A">WPS-enabled targets</text>
      <text x="124" y="246" fill="#10B981">$</text>
      <text x="140" y="246" fill="#F8FAFC">zerfi -i wlan0 --auto</text>
      <text x="124" y="268" fill="#10B981">✓</text>
      <text x="144" y="268" fill="#10B981">Auto-pwn mode engaged</text>
      <text x="124" y="290" fill="#71717A">[•] Target:  D-Link DIR-615</text>
      <text x="124" y="312" fill="#71717A">[•] BSSID:   AA:BB:CC:DD:EE:FF</text>
    </g>
  </g>

  <!-- Right side: Branding -->
  <g transform="translate(650, 120)">
    <!-- Floating terminal icon -->
    <rect x="10" y="10" width="70" height="70" rx="16" fill="#10B981" opacity="0.1"/>
    <rect x="10" y="10" width="70" height="70" rx="16" fill="none" stroke="#10B981" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="45" y="55" fill="#10B981" font-family="monospace" font-size="32" text-anchor="middle" font-weight="bold">Z</text>

    <text x="100" y="48" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="40" font-weight="800">ZerFi</text>
    <text x="100" y="78" fill="#71717A" font-family="'Inter', sans-serif" font-size="16">Advanced WiFi Security Auditing Tool</text>

    <!-- Badge tags -->
    <rect x="10" y="100" width="90" height="28" rx="14" fill="none" stroke="#10B981" stroke-opacity="0.4"/>
    <text x="55" y="119" fill="#10B981" font-family="'Inter', sans-serif" font-size="12" text-anchor="middle" font-weight="600">v2.0</text>

    <rect x="110" y="100" width="120" height="28" rx="14" fill="none" stroke="#3B82F6" stroke-opacity="0.4"/>
    <text x="170" y="119" fill="#3B82F6" font-family="'Inter', sans-serif" font-size="12" text-anchor="middle" font-weight="600">Global Install</text>

    <!-- Feature bullets -->
    <g font-family="'Inter', sans-serif" font-size="14" fill="#A1A1AA">
      <circle cx="16" cy="155" r="4" fill="#10B981"/>
      <text x="28" y="160">Pixie Dust Attack</text>

      <circle cx="16" cy="183" r="4" fill="#10B981"/>
      <text x="28" y="188">Online Brute-force</text>

      <circle cx="16" cy="211" r="4" fill="#10B981"/>
      <text x="28" y="216">Router Vulnerability DB</text>

      <circle cx="16" cy="239" r="4" fill="#10B981"/>
      <text x="28" y="244">HTML Report Generation</text>
    </g>

    <!-- Install button -->
    <rect x="10" y="270" width="180" height="42" rx="8" fill="#10B981"/>
    <text x="100" y="297" fill="#000" font-family="'Inter', sans-serif" font-size="15" text-anchor="middle" font-weight="700">curl -sLo installer.sh ...</text>
  </g>

  <!-- Bottom gradient line -->
  <rect x="0" y="398" width="1200" height="2" fill="url(#accent)" opacity="0.3"/>
</svg>
